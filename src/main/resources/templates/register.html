<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Rejestracja — Orlik Booking</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments/nav-public :: header}"></div>

<main style="max-width: 420px;">
    <div class="container">
        <h1><i class="fas fa-user-plus"></i> Zarejestruj się</h1>

        <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

        <form th:action="@{/register}" th:object="${registerRequest}" method="post">
            <div>
                <label for="firstName">Login:</label>
                <input type="text" id="firstName" th:field="*{firstName}" required>
                <small style="color:var(--danger)" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></small>
            </div>
            <div>
                <label for="email">Email:</label>
                <input type="email" id="email" th:field="*{email}" required>
                <small style="color:var(--danger)" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></small>
            </div>
            <div>
                <label for="password">Hasło:</label>
                <input type="password" id="password" th:field="*{password}" required>
                <small style="color:var(--danger)" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></small>
            </div>
            <button type="submit"><i class="fas fa-check-circle"></i> Zarejestruj</button>
        </form>

        <p style="text-align:center; margin-top:20px;">
            <a th:href="@{/login}">Masz już konto? Zaloguj się</a>
        </p>
    </div>
</main>
</body>
</html>

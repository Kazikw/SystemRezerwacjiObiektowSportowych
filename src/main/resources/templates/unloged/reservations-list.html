<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Wyniki Wyszukiwania — Orlik Booking</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments/nav-public :: header}"></div>

<main>
    <div class="container">
        <h1>Wyniki Wyszukiwania</h1>

        <table>
            <thead>
            <tr><th>Obiekt</th><th>Godzina</th><th>Osoby</th><th>Status</th></tr>
            </thead>
            <tbody>
            <tr th:each="v : ${reservationViews}" th:with="r=${v.reservation}">
                <td th:text="${r.facility.name} + ' (' + ${r.facility.city.name} + ')'"></td>
                <td th:text="${r.startTime} + ' - ' + ${r.endTime}"></td>
                <td th:text="${v.participantCount} + '/' + ${r.requiredParticipants}"></td>
                <td><span class="status-badge" th:classappend="'status-' + ${r.status.displayName}" th:text="${r.status.displayName}"></span></td>
            </tr>
            </tbody>
        </table>
        <p th:if="${#lists.isEmpty(reservationViews)}">Brak rezerwacji w tym terminie.</p>
        <p style="text-align:center; margin-top:20px;"><a th:href="@{/login}">Zaloguj się, aby dołączyć do rezerwacji.</a></p>
    </div>
</main>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Dashboard — Panel Admina</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<!--<div th:replace="~{fragments/nav-admin :: header('dashboard')}"></div>-->

<main>
    <div class="container">
        <h1>Panel Zarządcy</h1>

        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

        <h2>🕓 Niezatwierdzone rezerwacje</h2>

        <div th:if="${#lists.isEmpty(pendingReservations)}">
            <p>Brak niezatwierdzonych rezerwacji.</p>
        </div>

        <div th:unless="${#lists.isEmpty(pendingReservations)}">
            <div th:each="r : ${pendingReservations}" class="card" style="margin-bottom:12px;">
                <p>
                    <strong th:text="'Rezerwacja #' + ${r.id}"></strong> —
                    <span th:text="${r.reserver.firstName}"></span> —
                    <span th:text="${r.facility.name}"></span> —
                    <span th:text="${r.date}"></span>,
                    <span th:text="${r.startTime}"></span>
                </p>
                <div style="display:flex; gap:10px;">
                    <form th:action="@{'/admin/reservations/' + ${r.id} + '/confirm'}" method="post">
                        <button type="submit" class="btn btn-primary">Potwierdź</button>
                    </form>
                    <form th:action="@{'/admin/reservations/' + ${r.id} + '/cancel'}" method="post"
                          onsubmit="return confirm('Na pewno odwołać rezerwację?')">
                        <button type="submit" class="btn btn-danger">Odwołaj</button>
                    </form>
                </div>
            </div>
        </div>

        <h2>Szybkie akcje</h2>
        <div class="cards-grid">
            <div class="card">
                <p>📅 Podgląd rezerwacji w kalendarzu</p>
                <a th:href="@{/admin/calendar}" class="btn btn-primary">Zobacz</a>
            </div>
            <div class="card">
                <p>⚙️ Zarządzaj rezerwacjami (statusy, filtry)</p>
                <a th:href="@{/admin/reservations}" class="btn btn-primary">Przejdź</a>
            </div>
            <div class="card">
                <p>📛 Zablokuj obiekt w wybranym terminie</p>
                <a th:href="@{/admin/blockades}" class="btn btn-primary">Zablokuj</a>
            </div>
        </div>
    </div>
</main>
</body>
</html>

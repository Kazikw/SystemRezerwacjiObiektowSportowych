<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Wyniki Wyszukiwania — Orlik Booking</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments/nav-user :: header('search')}"></div>

<main>
    <div class="container">
        <h1>Wyniki Wyszukiwania</h1>

        <table>
            <thead>
            <tr><th>Obiekt</th><th>Godzina</th><th>Rezerwujący</th><th>Osoby</th><th>Status</th><th>Akcje</th></tr>
            </thead>
            <tbody>
            <tr th:each="v : ${reservationViews}" th:with="r=${v.reservation}">
                <td th:text="${r.facility.name} + ' (' + ${r.facility.city.name} + ')'"></td>
                <td th:text="${r.startTime} + ' - ' + ${r.endTime}"></td>
                <td th:text="${r.reserver.email}"></td>
                <td th:text="${v.participantCount} + '/' + ${r.requiredParticipants}"></td>
                <td><span class="status-badge" th:classappend="'status-' + ${r.status.displayName}" th:text="${r.status.displayName}"></span></td>
                <td>
                    <form th:if="${v.canJoin}" th:action="@{'/reservations/' + ${r.id} + '/join'}" method="post"
                          onsubmit="return confirm('Dołączyć do tej rezerwacji?')">
                        <button type="submit" class="btn btn-primary">Dołącz</button>
                    </form>
                    <span th:unless="${v.canJoin}" style="color:var(--secondary);">Niedostępne</span>
                </td>
            </tr>
            </tbody>
        </table>
        <p th:if="${#lists.isEmpty(reservationViews)}">Brak rezerwacji w tym terminie.</p>
    </div>
</main>
</body>
</html>

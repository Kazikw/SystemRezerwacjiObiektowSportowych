<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Mój Profil — Orlik Booking</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments/nav-user :: header('profile')}"></div>

<main>
    <div class="container">
        <h1>Mój Profil</h1>

        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

        <h2>Moje Dane</h2>
        <p><strong>Login:</strong> <span th:text="${user.firstName}"></span></p>
        <p><strong>Email:</strong> <span th:text="${user.email}"></span></p>

        <h2>Dodaj Znajomego</h2>
        <form th:action="@{/user/friends/add}" method="post" style="flex-direction:row; align-items:flex-end;">
            <div style="flex-grow:1;">
                <label for="friendEmail">Email znajomego</label>
                <input type="email" id="friendEmail" name="friendEmail" required>
            </div>
            <button type="submit">Dodaj</button>
        </form>

        <h2>Moi Znajomi</h2>
        <ul th:if="${not #lists.isEmpty(friends)}" style="list-style:none; padding:0;">
            <li th:each="friend : ${friends}" style="display:flex; justify-content:space-between; align-items:center; background:#f8f9fa; padding:12px; border-radius:6px; margin-bottom:8px;">
                <span th:text="${friend.firstName} + ' (' + ${friend.email} + ')'"></span>
                <form th:action="@{/user/friends/remove}" method="post" style="margin:0;"
                      onsubmit="return confirm('Usunąć tego znajomego?')">
                    <input type="hidden" name="friendId" th:value="${friend.id}">
                    <button type="submit" class="btn btn-danger">Usuń</button>
                </form>
            </li>
        </ul>
        <p th:if="${#lists.isEmpty(friends)}">Nie masz jeszcze znajomych. Dodaj ich powyżej!</p>
    </div>
</main>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Dashboard — Orlik Booking</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments/nav-user :: header('dashboard')}"></div>

<main>
    <h1>Witaj, <span th:text="${userName}">Użytkowniku</span>!</h1>

    <div class="cards-grid">
        <div class="card">
            <h2><i class="fas fa-calendar-check"></i> Nadchodzące (jako uczestnik)</h2>
            <div th:if="${#lists.isEmpty(upcomingReservations)}">
                <p>Brak nadchodzących rezerwacji.</p>
            </div>
            <ul th:unless="${#lists.isEmpty(upcomingReservations)}" style="list-style:none; padding:0;">
                <li th:each="r : ${upcomingReservations}" style="margin-bottom:12px; border-bottom:1px dashed #ddd; padding-bottom:8px;">
                    <strong th:text="${r.facility.name}"></strong> —
                    <span th:text="${r.date}"></span>,
                    <span th:text="${r.startTime} + ' - ' + ${r.endTime}"></span><br>
                    <span class="status-badge" th:classappend="'status-' + ${r.status.displayName}" th:text="${r.status.displayName}"></span>
                </li>
            </ul>
            <a th:href="@{/reservations/user/my-reservations}" class="btn btn-primary">Zobacz wszystkie</a>
        </div>

        <div class="card">
            <h2><i class="fas fa-users-cog"></i> Moje Rezerwacje Grupowe</h2>
            <div th:if="${#lists.isEmpty(myActiveGroupReservations)}">
                <p>Brak aktywnych rezerwacji grupowych.</p>
            </div>
            <ul th:unless="${#lists.isEmpty(myActiveGroupReservations)}" style="list-style:none; padding:0;">
                <li th:each="r : ${myActiveGroupReservations}" style="margin-bottom:12px; border-bottom:1px dashed #ddd; padding-bottom:8px;">
                    <strong th:text="${r.facility.name}"></strong> —
                    <span th:text="${r.date}"></span>,
                    <span th:text="${r.startTime} + ' - ' + ${r.endTime}"></span><br>
                    <span class="status-badge" th:classappend="'status-' + ${r.status.displayName}" th:text="${r.status.displayName}"></span>
                </li>
            </ul>
            <a th:href="@{/reservations/create}" class="btn btn-primary">Zarezerwuj nową</a>
        </div>

        <div class="card">
            <h2><i class="fas fa-search-plus"></i> Do Dołączenia</h2>
            <div th:if="${#lists.isEmpty(joinableReservations)}">
                <p>Brak otwartych rezerwacji do dołączenia.</p>
            </div>
            <ul th:unless="${#lists.isEmpty(joinableReservations)}" style="list-style:none; padding:0;">
                <li th:each="r : ${joinableReservations}" style="margin-bottom:12px; border-bottom:1px dashed #ddd; padding-bottom:8px;">
                    <strong th:text="${r.facility.name}"></strong> —
                    <span th:text="${r.date}"></span>,
                    <span th:text="${r.startTime} + ' - ' + ${r.endTime}"></span>
                </li>
            </ul>
            <a th:href="@{/}" class="btn btn-primary">Szukaj więcej</a>
        </div>
    </div>
</main>
</body>
</html>

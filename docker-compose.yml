services:
  postgres:
    image: postgres:16
    container_name: orlik-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: orlik_booking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - orlik_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orlik_booking"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  orlik_pgdata: